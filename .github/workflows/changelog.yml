name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag (e.g. 0.1.62 or v0.1.62)'
        required: true
        type: string
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: --latest --strip header --output RELEASE_NOTES.md

      # GITHUB_TOKEN cannot trigger downstream release workflows.
      # A maintainer publishing the draft triggers PyPI and Docker.
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if jq -e '.isDraft' release.json > /dev/null; then
              gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
            else
              echo "Release is already published; leaving it unchanged."
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "EasyPQP $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
