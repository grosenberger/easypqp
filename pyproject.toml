[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=8.2", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "easypqp"
dynamic = ["version"]
description = "EasyPQP: Simple library generation for OpenSWATH"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "George Rosenberger", email = "gr2578@cumc.columbia.edu" },
]
license = "BSD-3-Clause"
# Core dependencies required for basic EasyPQP functionality
dependencies = [
  "numba>=0.60.0",
  "Click>=8.0.0",
  "numpy>=2.0.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.4.2",
  "statsmodels>=0.14.2",
  "pandas>=2.2.2",
  "biopython>=1.87",
  "pyopenms>=3.3.0,<3.7",
  "matplotlib>=3.8.4",
  # Security floors for transitive dependencies and Parquet input support.
  "pillow>=13.0.0",
  "pyarrow>=23.0.1",
  "seaborn",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/grosenberger/easypqp"

[project.scripts]
easypqp = "easypqp.main:cli"

[project.optional-dependencies]

# PyProphet integration
# Install with: pip install easypqp[pyprophet]
pyprophet = ["pyprophet>=3.0.2", "pypdf>=6.21.1"]

# Rust backend for in-silico library generation
# Install with: pip install easypqp[rust]
rust = ["easypqp-rs>=0.1.9"]

# All optional features
# Install with: pip install easypqp[all]
all = [
  "pyprophet>=3.0.2",
  "pypdf>=6.21.1",
  "easypqp-rs>=0.1.9"
]

[tool.setuptools_scm]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["easypqp*"]

[tool.setuptools.package-data]
easypqp = ["data/unimod.xml"]
